services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      DATA_DIR: /data
    volumes:
      - sweetspot_data:/data
    expose:
      - "8000"
    restart: unless-stopped
  caddy:
    image: caddy:2
    env_file:
      - ../.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
volumes:
  sweetspot_data:
  caddy_data:
  caddy_config:
